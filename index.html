<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Multi Timer">
    <title>Multi Timer - DaVinci Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 10px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: #252525;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #d95d39;
        }

        h1 {
            color: #d95d39;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .add-timer-btn {
            background: #d95d39;
            color: white;
            border: none;
            padding: 15px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            touch-action: manipulation;
        }

        .add-timer-btn:active {
            background: #e76f51;
        }

        .save-load-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .save-btn, .load-btn, .share-btn {
            background: #444;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            touch-action: manipulation;
        }

        .save-btn:active, .load-btn:active, .share-btn:active {
            background: #555;
        }

        .share-btn {
            background: #2a9d8f;
        }

        .share-btn:active {
            background: #3bb3a3;
        }

        .timers-container {
            display: grid;
            gap: 15px;
        }

        .timer-card {
            background: #252525;
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid #4a4a4a;
        }

        .timer-card.running {
            border-left-color: #d95d39;
        }

        .timer-card.negative {
            border-left-color: #ff3333;
        }

        .timer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .timer-name-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .timer-name {
            background: transparent;
            border: none;
            color: #e0e0e0;
            font-size: 18px;
            font-weight: 600;
            padding: 5px;
            border-bottom: 2px solid transparent;
            width: 120px;
            flex-shrink: 0;
            transition: color 0.3s ease;
        }

        .timer-name:focus {
            outline: none;
            border-bottom-color: #d95d39;
        }

        .timer-title {
            background: transparent;
            border: none;
            color: #999;
            font-size: 16px;
            padding: 5px;
            border-bottom: 2px solid transparent;
            flex: 1;
            min-width: 0;
        }

        .timer-title:focus {
            outline: none;
            border-bottom-color: #d95d39;
            color: #e0e0e0;
        }

        .timer-title::placeholder {
            color: #666;
        }

        .timer-controls-top {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .icon-btn {
            background: #333;
            border: none;
            color: #e0e0e0;
            width: 44px;
            height: 44px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            touch-action: manipulation;
        }

        .icon-btn:active {
            background: #444;
        }

        .icon-btn.delete {
            background: #662222;
        }

        .icon-btn.delete:active {
            background: #883333;
        }

        .icon-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .timer-setup {
            display: grid;
            gap: 15px;
            margin-bottom: 15px;
        }

        .mode-selector {
            display: flex;
            background: #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: #888;
            padding: 14px 20px;
            cursor: pointer;
            font-size: 14px;
            flex: 1;
            touch-action: manipulation;
        }

        .mode-btn.active {
            background: #d95d39;
            color: white;
        }

        .time-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .time-input {
            background: #1a1a1a;
            border: 2px solid #333;
            color: #e0e0e0;
            padding: 14px;
            border-radius: 4px;
            width: 90px;
            text-align: center;
            font-size: 18px;
        }

        .time-input:focus {
            outline: none;
            border-color: #d95d39;
        }

        .timer-display {
            font-size: 64px;
            font-weight: 700;
            text-align: center;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
            color: #e0e0e0;
            text-shadow: 0 0 20px rgba(217, 93, 57, 0.3);
            transition: color 0.3s ease;
        }

        .timer-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 10px 0;
        }

        .timer-target {
            font-size: 18px;
            color: #888;
            font-weight: 500;
        }

        .timer-overage {
            font-size: 18px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 4px;
            background: rgba(255, 51, 51, 0.2);
            color: #ff6666;
        }

        .timer-progress {
            font-size: 18px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 4px;
            background: rgba(51, 204, 51, 0.2);
            color: #66ff66;
        }

        .timer-display.negative {
            color: #ffffff !important;
            text-shadow: 0 0 30px rgba(255, 51, 51, 0.8);
        }

        .timer-display.warning-30 {
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .timer-display.warning-10 {
            color: #ff8c00;
            text-shadow: 0 0 20px rgba(255, 140, 0, 0.6);
        }

        .timer-display.warning-5 {
            color: #ff3333;
            text-shadow: 0 0 20px rgba(255, 51, 51, 0.7);
        }

        .timer-card.negative {
            background: #4d0000 !important;
            border-left-color: #ff0000 !important;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
        }

        .timer-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .timer-controls .start, 
        .timer-controls .pause {
            grid-column: 1 / -1;
        }

        .color-picker-wrapper {
            position: relative;
        }

        .color-picker-btn {
            background: #444;
            border: none;
            color: #e0e0e0;
            padding: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .color-picker-btn:active {
            background: #555;
            transform: scale(0.98);
        }

        .color-preview {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            border: 2px solid #666;
            display: inline-block;
        }

        .color-palette {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            right: 0;
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .color-palette.active {
            display: block;
        }

        .color-palette-title {
            color: #999;
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .color-option {
            width: 100%;
            aspect-ratio: 1;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            touch-action: manipulation;
        }

        .color-option:active {
            transform: scale(0.9);
        }

        .color-option.selected {
            box-shadow: 0 0 0 3px #d95d39, 0 0 10px rgba(217, 93, 57, 0.5);
            transform: scale(1.1);
        }

        .control-btn {
            background: #333;
            border: none;
            color: #e0e0e0;
            padding: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            touch-action: manipulation;
        }

        .control-btn:active {
            transform: scale(0.98);
        }

        .control-btn.start {
            background: #2d882d;
            grid-column: 1 / -1;
        }

        .control-btn.start:active {
            background: #3ea63e;
        }

        .control-btn.pause {
            background: #d95d39;
            grid-column: 1 / -1;
        }

        .control-btn.pause:active {
            background: #e76f51;
        }

        .control-btn.reset {
            background: #666;
        }

        .control-btn.reset:active {
            background: #777;
        }

        .total-overage-btn {
            background: #8b4513;
            border: none;
            color: #e0e0e0;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            touch-action: manipulation;
            grid-column: 1 / -1;
            margin-top: 5px;
        }

        .total-overage-btn:active {
            background: #a0522d;
            transform: scale(0.98);
        }

        .overage-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .overage-modal.active {
            display: flex;
        }

        .overage-modal-content {
            background: #252525;
            border-radius: 12px;
            padding: 25px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid #d95d39;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .overage-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #333;
        }

        .overage-modal-title {
            color: #d95d39;
            font-size: 22px;
            font-weight: 700;
        }

        .overage-modal-close {
            background: #662222;
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .overage-modal-close:active {
            background: #883333;
        }

        .overage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
            background: #1a1a1a;
            border-radius: 6px;
            border-left: 4px solid;
        }

        .overage-item-name {
            font-weight: 600;
            font-size: 16px;
        }

        .overage-item-time {
            font-size: 18px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .overage-item.countdown {
            border-left-color: #ff3333;
        }

        .overage-item.countdown .overage-item-time {
            color: #ff6666;
        }

        .overage-item.countup {
            border-left-color: #33cc33;
        }

        .overage-item.countup .overage-item-time {
            color: #66ff66;
        }

        .overage-total {
            margin-top: 20px;
            padding: 20px;
            background: #2d2d2d;
            border-radius: 8px;
            border: 2px solid #d95d39;
            text-align: center;
        }

        .overage-total-label {
            color: #999;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .overage-total-time {
            font-size: 32px;
            font-weight: 700;
            color: #d95d39;
            font-variant-numeric: tabular-nums;
        }

        .overage-empty {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            font-size: 16px;
        }

        @media (max-width: 480px) {
            .timer-display {
                font-size: 48px;
            }

            .timer-name {
                font-size: 16px;
            }

            .timer-name-group {
                flex-direction: column;
                align-items: stretch;
                gap: 5px;
            }

            .timer-name {
                width: 100%;
            }

            .icon-btn {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⏱️ Multi Timer</h1>
            <button class="add-timer-btn" id="addTimerBtn">+ Nuovo Timer</button>
            <div class="save-load-controls">
                <button class="save-btn" id="saveBtn">💾 Salva</button>
                <button class="load-btn" id="loadBtn">📂 Carica</button>
                <button class="share-btn" id="shareBtn">🔗 Condividi</button>
            </div>
        </div>
        
        <div class="timers-container" id="timersContainer"></div>
    </div>

    <!-- Overage Modal -->
    <div class="overage-modal" id="overageModal">
        <div class="overage-modal-content">
            <div class="overage-modal-header">
                <div class="overage-modal-title">📊 Riepilogo Sforamenti</div>
                <button class="overage-modal-close" id="closeOverageModal">✕</button>
            </div>
            <div id="overageList"></div>
        </div>
    </div>

    <script>
        'use strict';
        
        class Timer {
            constructor(id) {
                this.id = id;
                this.name = 'Timer ' + (id + 1);
                this.title = '';
                this.mode = 'countdown';
                this.minutes = 5;
                this.seconds = 0;
                this.currentTime = 0;
                this.targetTime = 300;
                this.isRunning = false;
                this.interval = null;
                this.color = '#4a4a4a'; // Default gray
            }

            start() {
                if (this.isRunning) return;
                
                this.isRunning = true;
                if (this.mode === 'countdown' && this.currentTime === 0) {
                    this.currentTime = this.targetTime;
                }
                
                var self = this;
                this.interval = setInterval(function() {
                    if (self.mode === 'countdown') {
                        self.currentTime--;
                    } else {
                        self.currentTime++;
                    }
                    self.updateDisplay();
                }, 1000);
                
                this.updateDisplay();
            }

            pause() {
                this.isRunning = false;
                if (this.interval) {
                    clearInterval(this.interval);
                    this.interval = null;
                }
                this.updateDisplay();
            }

            reset() {
                this.pause();
                this.currentTime = 0;
                this.updateDisplay();
            }

            setTime(minutes, seconds) {
                this.minutes = minutes;
                this.seconds = seconds;
                this.targetTime = minutes * 60 + seconds;
                if (!this.isRunning) {
                    this.currentTime = 0;
                }
                this.updateDisplay();
            }

            setMode(mode) {
                this.mode = mode;
                this.reset();
            }

            formatTime() {
                var absTime = Math.abs(this.currentTime);
                var mins = Math.floor(absTime / 60);
                var secs = absTime % 60;
                var sign = this.currentTime < 0 ? '-' : '';
                return sign + String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
            }

            formatOverage() {
                // For countdown: show how much over time
                if (this.mode === 'countdown' && this.currentTime < 0) {
                    var absTime = Math.abs(this.currentTime);
                    var mins = Math.floor(absTime / 60);
                    var secs = absTime % 60;
                    return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
                }
                return null;
            }

            formatProgress() {
                // For countup: show progress after reaching target
                if (this.mode === 'countup' && this.currentTime >= this.targetTime && this.targetTime > 0) {
                    var overage = this.currentTime - this.targetTime;
                    var mins = Math.floor(overage / 60);
                    var secs = overage % 60;
                    return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
                }
                return null;
            }

            getTargetDisplay() {
                if (this.targetTime === 0) return null;
                var mins = Math.floor(this.targetTime / 60);
                var secs = this.targetTime % 60;
                return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
            }

            isNegative() {
                return this.mode === 'countdown' && this.currentTime < 0;
            }

            updateDisplay() {
                var card = document.querySelector('[data-timer-id="' + this.id + '"]');
                if (!card) return;

                var display = card.querySelector('.timer-display');
                var startBtn = card.querySelector('.start-btn');
                var pauseBtn = card.querySelector('.pause-btn');
                var timerName = card.querySelector('.timer-name');
                var timerInfo = card.querySelector('.timer-info');

                display.textContent = this.formatTime();
                
                // Color the timer name
                timerName.style.color = this.color;
                
                // Update info display (target/overage/progress)
                var targetDisplay = this.getTargetDisplay();
                var overageDisplay = this.formatOverage();
                var progressDisplay = this.formatProgress();
                
                var infoHTML = '';
                if (targetDisplay) {
                    infoHTML += '<span class="timer-target">Target: ' + targetDisplay + '</span>';
                }
                if (overageDisplay) {
                    infoHTML += '<span class="timer-overage">Sforato: ' + overageDisplay + '</span>';
                }
                if (progressDisplay) {
                    infoHTML += '<span class="timer-progress">Oltre: ' + progressDisplay + '</span>';
                }
                timerInfo.innerHTML = infoHTML;
                
                // Remove all warning classes first
                display.classList.remove('negative', 'warning-30', 'warning-10', 'warning-5');
                card.classList.remove('negative');
                
                // Apply color warnings based on time remaining
                if (this.isNegative()) {
                    display.classList.add('negative');
                    card.classList.add('negative');
                } else if (this.mode === 'countdown' && this.isRunning) {
                    if (this.currentTime <= 5 && this.currentTime > 0) {
                        display.classList.add('warning-5');
                    } else if (this.currentTime <= 10 && this.currentTime > 5) {
                        display.classList.add('warning-10');
                    } else if (this.currentTime <= 30 && this.currentTime > 10) {
                        display.classList.add('warning-30');
                    }
                }

                // Update card border color (but not when negative)
                if (!this.isNegative()) {
                    card.style.borderLeftColor = this.color;
                }

                if (this.isRunning) {
                    card.classList.add('running');
                    startBtn.style.display = 'none';
                    pauseBtn.style.display = 'block';
                } else {
                    card.classList.remove('running');
                    startBtn.style.display = 'block';
                    pauseBtn.style.display = 'none';
                }
            }

            destroy() {
                this.pause();
            }
        }

        var app = {
            timers: [],
            timerId: 0,

            init: function() {
                var self = this;
                document.getElementById('addTimerBtn').addEventListener('click', function() {
                    self.addTimer();
                });
                
                document.getElementById('saveBtn').addEventListener('click', function() {
                    self.saveConfiguration();
                });
                
                document.getElementById('loadBtn').addEventListener('click', function() {
                    self.loadConfiguration();
                });

                document.getElementById('shareBtn').addEventListener('click', function() {
                    self.shareApp();
                });

                document.getElementById('closeOverageModal').addEventListener('click', function() {
                    document.getElementById('overageModal').classList.remove('active');
                });

                // Close modal when clicking outside
                document.getElementById('overageModal').addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.classList.remove('active');
                    }
                });
                
                // Try to load saved state
                this.loadFromLocalStorage();
                
                // Check if there's a config in the URL (shared link)
                var loadedFromURL = this.loadConfigFromURL();
                
                // If no timers loaded from URL or localStorage, add one default
                if (this.timers.length === 0) {
                    this.addTimer();
                }
            },

            showTotalOverage: function() {
                var overages = [];
                var totalSeconds = 0;

                for (var i = 0; i < this.timers.length; i++) {
                    var timer = this.timers[i];
                    var overageSeconds = 0;
                    var type = '';

                    if (timer.mode === 'countdown' && timer.currentTime < 0) {
                        overageSeconds = Math.abs(timer.currentTime);
                        type = 'countdown';
                    } else if (timer.mode === 'countup' && timer.currentTime >= timer.targetTime && timer.targetTime > 0) {
                        overageSeconds = timer.currentTime - timer.targetTime;
                        type = 'countup';
                    }

                    if (overageSeconds > 0) {
                        overages.push({
                            name: timer.name,
                            title: timer.title,
                            seconds: overageSeconds,
                            type: type,
                            color: timer.color
                        });
                        totalSeconds += overageSeconds;
                    }
                }

                var listHTML = '';
                
                if (overages.length === 0) {
                    listHTML = '<div class="overage-empty">✓ Nessun timer fuori tempo</div>';
                } else {
                    for (var i = 0; i < overages.length; i++) {
                        var overage = overages[i];
                        var mins = Math.floor(overage.seconds / 60);
                        var secs = overage.seconds % 60;
                        var timeStr = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
                        var label = overage.type === 'countdown' ? 'Sforato' : 'Oltre';
                        
                        listHTML += '<div class="overage-item ' + overage.type + '" style="border-left-color: ' + overage.color + '">';
                        listHTML += '  <div>';
                        listHTML += '    <div class="overage-item-name" style="color: ' + overage.color + '">' + overage.name + '</div>';
                        if (overage.title) {
                            listHTML += '    <div style="color: #666; font-size: 12px;">' + overage.title + '</div>';
                        }
                        listHTML += '  </div>';
                        listHTML += '  <div>';
                        listHTML += '    <div style="color: #888; font-size: 11px; text-align: right;">' + label + '</div>';
                        listHTML += '    <div class="overage-item-time">' + timeStr + '</div>';
                        listHTML += '  </div>';
                        listHTML += '</div>';
                    }

                    var totalMins = Math.floor(totalSeconds / 60);
                    var totalSecs = totalSeconds % 60;
                    var totalStr = String(totalMins).padStart(2, '0') + ':' + String(totalSecs).padStart(2, '0');

                    listHTML += '<div class="overage-total">';
                    listHTML += '  <div class="overage-total-label">Totale Sforamenti</div>';
                    listHTML += '  <div class="overage-total-time">' + totalStr + '</div>';
                    listHTML += '</div>';
                }

                document.getElementById('overageList').innerHTML = listHTML;
                document.getElementById('overageModal').classList.add('active');
            },

            shareApp: function() {
                var self = this;
                
                // Create configuration data
                var config = {
                    timers: this.timers.map(function(timer) {
                        return {
                            name: timer.name,
                            title: timer.title,
                            mode: timer.mode,
                            minutes: timer.minutes,
                            seconds: timer.seconds,
                            targetTime: timer.targetTime,
                            color: timer.color
                        };
                    }),
                    date: new Date().toISOString()
                };

                var configJSON = JSON.stringify(config);
                var configEncoded = btoa(encodeURIComponent(configJSON));
                
                // Create shareable URL with configuration
                var baseUrl = window.location.origin + window.location.pathname;
                var shareUrl = baseUrl + '?config=' + configEncoded;
                
                var title = 'Multi Timer - Configurazione';
                var text = 'Ho creato ' + this.timers.length + ' timer. Apri questo link per caricarli!';

                // Check if Web Share API is supported (mobile devices)
                if (navigator.share) {
                    navigator.share({
                        title: title,
                        text: text,
                        url: shareUrl
                    }).then(function() {
                        console.log('Condivisione riuscita');
                    }).catch(function(error) {
                        console.log('Condivisione annullata', error);
                    });
                } 
                // Fallback: copy to clipboard or download
                else {
                    // Try to copy URL to clipboard
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(shareUrl).then(function() {
                            var msg = '✅ Link con configurazione copiato!\n\n';
                            msg += 'Timer inclusi: ' + self.timers.length + '\n\n';
                            msg += 'Invia il link a chi vuoi condividere i timer.';
                            alert(msg);
                        }).catch(function(err) {
                            self.downloadConfig(config);
                        });
                    } else {
                        // Offer to download as JSON file
                        var download = confirm('Vuoi scaricare la configurazione come file JSON?\n\n(Altrimenti ti verrà mostrato il link da copiare)');
                        if (download) {
                            self.downloadConfig(config);
                        } else {
                            prompt('Copia questo link per condividere i timer:', shareUrl);
                        }
                    }
                }
            },

            downloadConfig: function(config) {
                var configJSON = JSON.stringify(config, null, 2);
                var blob = new Blob([configJSON], { type: 'application/json' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'timer-config-' + new Date().toISOString().split('T')[0] + '.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                alert('✅ Configurazione scaricata!\n\nPuoi inviare il file JSON e chi lo riceve può caricarlo con "📂 Carica".');
            },

            loadConfigFromURL: function() {
                var urlParams = new URLSearchParams(window.location.search);
                var configParam = urlParams.get('config');
                
                if (configParam) {
                    try {
                        var configJSON = decodeURIComponent(atob(configParam));
                        var config = JSON.parse(configJSON);
                        
                        // Clear current timers
                        for (var i = 0; i < this.timers.length; i++) {
                            this.timers[i].destroy();
                        }
                        this.timers = [];
                        
                        // Load timers from URL config
                        for (var i = 0; i < config.timers.length; i++) {
                            var savedTimer = config.timers[i];
                            var timer = new Timer(this.timerId++);
                            timer.name = savedTimer.name || timer.name;
                            timer.title = savedTimer.title || '';
                            timer.mode = savedTimer.mode || 'countdown';
                            timer.minutes = savedTimer.minutes || 5;
                            timer.seconds = savedTimer.seconds || 0;
                            timer.targetTime = savedTimer.targetTime || 300;
                            timer.color = savedTimer.color || '#4a4a4a';
                            
                            this.timers.push(timer);
                        }
                        
                        this.renderAllTimers();
                        this.saveToLocalStorage();
                        
                        // Clean URL (remove config parameter)
                        var cleanUrl = window.location.origin + window.location.pathname;
                        window.history.replaceState({}, document.title, cleanUrl);
                        
                        alert('✅ Configurazione caricata dal link!\n\n' + config.timers.length + ' timer importati.');
                        
                        return true;
                    } catch (e) {
                        console.error('Failed to load config from URL:', e);
                        alert('❌ Errore nel caricamento della configurazione dal link.');
                    }
                }
                return false;
            },

            saveToLocalStorage: function() {
                var data = {
                    timers: this.timers.map(function(timer) {
                        return {
                            name: timer.name,
                            title: timer.title,
                            mode: timer.mode,
                            minutes: timer.minutes,
                            seconds: timer.seconds,
                            targetTime: timer.targetTime,
                            color: timer.color
                        };
                    }),
                    timerId: this.timerId
                };
                
                try {
                    localStorage.setItem('multiTimerState', JSON.stringify(data));
                } catch (e) {
                    console.error('Failed to save to localStorage:', e);
                }
            },

            loadFromLocalStorage: function() {
                try {
                    var saved = localStorage.getItem('multiTimerState');
                    if (!saved) return;
                    
                    var data = JSON.parse(saved);
                    this.timerId = data.timerId || 0;
                    
                    for (var i = 0; i < data.timers.length; i++) {
                        var savedTimer = data.timers[i];
                        var timer = new Timer(this.timerId++);
                        timer.name = savedTimer.name || timer.name;
                        timer.title = savedTimer.title || '';
                        timer.mode = savedTimer.mode || 'countdown';
                        timer.minutes = savedTimer.minutes || 5;
                        timer.seconds = savedTimer.seconds || 0;
                        timer.targetTime = savedTimer.targetTime || 300;
                        timer.color = savedTimer.color || '#4a4a4a';
                        
                        this.timers.push(timer);
                        this.renderTimer(timer);
                    }
                } catch (e) {
                    console.error('Failed to load from localStorage:', e);
                }
            },

            saveConfiguration: function() {
                var configs = [];
                try {
                    var saved = localStorage.getItem('multiTimerConfigs');
                    if (saved) {
                        configs = JSON.parse(saved);
                    }
                } catch (e) {
                    configs = [];
                }
                
                var name = prompt('Nome della configurazione:', 'Config ' + (configs.length + 1));
                if (!name) return;
                
                var config = {
                    name: name,
                    date: new Date().toISOString(),
                    timers: this.timers.map(function(timer) {
                        return {
                            name: timer.name,
                            title: timer.title,
                            mode: timer.mode,
                            minutes: timer.minutes,
                            seconds: timer.seconds,
                            targetTime: timer.targetTime,
                            color: timer.color
                        };
                    })
                };
                
                configs.push(config);
                
                try {
                    localStorage.setItem('multiTimerConfigs', JSON.stringify(configs));
                    alert('✅ Configurazione "' + name + '" salvata!');
                } catch (e) {
                    alert('❌ Errore nel salvataggio: ' + e.message);
                }
            },

            loadConfiguration: function() {
                var self = this;
                
                // Show options: load from saved configs or import JSON file
                var choice = confirm('📂 CARICA CONFIGURAZIONE\n\nOK = Carica da configurazioni salvate\nAnnulla = Importa file JSON');
                
                if (choice) {
                    // Load from saved configs
                    this.loadFromSavedConfigs();
                } else {
                    // Import JSON file
                    this.importConfigFile();
                }
            },

            loadFromSavedConfigs: function() {
                var self = this;
                var configs = [];
                
                try {
                    var saved = localStorage.getItem('multiTimerConfigs');
                    if (saved) {
                        configs = JSON.parse(saved);
                    }
                } catch (e) {
                    alert('❌ Errore nel caricamento');
                    return;
                }
                
                if (configs.length === 0) {
                    alert('Nessuna configurazione salvata');
                    return;
                }
                
                var message = 'Scegli configurazione:\n\n';
                for (var i = 0; i < configs.length; i++) {
                    var date = new Date(configs[i].date);
                    message += (i + 1) + '. ' + configs[i].name + ' (' + configs[i].timers.length + ' timer) - ' + date.toLocaleDateString() + '\n';
                }
                message += '\nInserisci il numero (o 0 per annullare):';
                
                var choiceNum = prompt(message);
                if (!choiceNum || choiceNum === '0') return;
                
                var index = parseInt(choiceNum) - 1;
                if (index < 0 || index >= configs.length) {
                    alert('❌ Scelta non valida');
                    return;
                }
                
                this.loadTimersFromConfig(configs[index]);
                alert('✅ Configurazione "' + configs[index].name + '" caricata!');
            },

            importConfigFile: function() {
                var self = this;
                var input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                
                input.onchange = function(e) {
                    var file = e.target.files[0];
                    if (!file) return;
                    
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        try {
                            var config = JSON.parse(e.target.result);
                            self.loadTimersFromConfig(config);
                            alert('✅ File JSON importato!\n\n' + config.timers.length + ' timer caricati.');
                        } catch (err) {
                            alert('❌ Errore: file JSON non valido');
                        }
                    };
                    reader.readAsText(file);
                };
                
                input.click();
            },

            loadTimersFromConfig: function(config) {
                // Clear current timers
                for (var i = 0; i < this.timers.length; i++) {
                    this.timers[i].destroy();
                }
                this.timers = [];
                
                // Load selected config
                for (var i = 0; i < config.timers.length; i++) {
                    var savedTimer = config.timers[i];
                    var timer = new Timer(this.timerId++);
                    timer.name = savedTimer.name || timer.name;
                    timer.title = savedTimer.title || '';
                    timer.mode = savedTimer.mode || 'countdown';
                    timer.minutes = savedTimer.minutes || 5;
                    timer.seconds = savedTimer.seconds || 0;
                    timer.targetTime = savedTimer.targetTime || 300;
                    timer.color = savedTimer.color || '#4a4a4a';
                    
                    this.timers.push(timer);
                }
                
                this.renderAllTimers();
                this.saveToLocalStorage();
            },

            addTimer: function() {
                var timer = new Timer(this.timerId++);
                this.timers.push(timer);
                this.renderTimer(timer);
                this.saveToLocalStorage();
            },

            duplicateTimer: function(timer) {
                var newTimer = new Timer(this.timerId++);
                newTimer.name = timer.name + ' (copia)';
                newTimer.title = timer.title;
                newTimer.mode = timer.mode;
                newTimer.minutes = timer.minutes;
                newTimer.seconds = timer.seconds;
                newTimer.targetTime = timer.targetTime;
                newTimer.color = timer.color;
                
                var index = this.timers.indexOf(timer);
                this.timers.splice(index + 1, 0, newTimer);
                this.renderAllTimers();
                this.saveToLocalStorage();
            },

            deleteTimer: function(timer) {
                timer.destroy();
                var index = this.timers.indexOf(timer);
                this.timers.splice(index, 1);
                this.renderAllTimers();
                this.saveToLocalStorage();
            },

            moveTimer: function(timer, direction) {
                var index = this.timers.indexOf(timer);
                var newIndex = direction === 'up' ? index - 1 : index + 1;
                
                if (newIndex < 0 || newIndex >= this.timers.length) return;
                
                this.timers.splice(index, 1);
                this.timers.splice(newIndex, 0, timer);
                this.renderAllTimers();
                this.saveToLocalStorage();
            },

                var self = this;
                var container = document.getElementById('timersContainer');
                var card = document.createElement('div');
                card.className = 'timer-card';
                card.dataset.timerId = timer.id;
                
                card.innerHTML =

                            '<input type="text" class="timer-name" value="' + timer.name + '" placeholder="Nome">' +
                            '<input type="text" class="timer-title" value="' + timer.title + '" placeholder="Titolo...">' +
                        '</div>' +
                        '<div class="timer-controls-top">' +
                            '<button class="icon-btn duplicate-btn" title="Duplica">📋</button>' +
                            '<button class="icon-btn move-up-btn" title="Sposta su">▲</button>' +

                        '</div>' +
                    '</div>' +
                    '<div class="timer-setup">' +
                        '<div class="mode-selector">' +
                            '<button class="mode-btn countdown-btn active">Countdown</button>' +
                            '<button class="mode-btn countup-btn">Countup</button>' +
                        '</div>' +
                        '<div class="time-input-group">' +
                            '<input type="number" class="time-input minutes-input" min="0" max="999" value="' + timer.minutes + '" placeholder="Min">' +
                            '<span style="font-size: 24px;">:</span>' +
                            '<input type="number" class="time-input seconds-input" min="0" max="59" value="' + timer.seconds + '" placeholder="Sec">' +
                        '</div>' +
                    '</div>' +
                    '<div class="timer-display">' + timer.formatTime() + '</div>' +
                    '<div class="timer-info"></div>' +
                    '<div class="timer-controls">' +
                        '<button class="control-btn start start-btn">▶ Start</button>' +
                        '<button class="control-btn pause pause-btn" style="display: none;">⏸ Pausa</button>' +
                        '<button class="control-btn reset reset-btn">⟲ Reset</button>' +
                        '<div class="color-picker-wrapper">' +
                            '<button class="color-picker-btn">' +
                                '<span class="color-preview" style="background-color: ' + timer.color + '"></span>' +
                                '🎨' +
                            '</button>' +
                            '<div class="color-palette">' +
                                '<div class="color-palette-title">Palette DaVinci</div>' +
                                '<div class="color-grid">' +
                                    '<button class="color-option" style="background: #d95d39" data-color="#d95d39"></button>' +
                                    '<button class="color-option" style="background: #e76f51" data-color="#e76f51"></button>' +
                                    '<button class="color-option" style="background: #f4a261" data-color="#f4a261"></button>' +
                                    '<button class="color-option" style="background: #e9c46a" data-color="#e9c46a"></button>' +
                                    '<button class="color-option" style="background: #2a9d8f" data-color="#2a9d8f"></button>' +
                                    '<button class="color-option" style="background: #264653" data-color="#264653"></button>' +
                                '</div>' +
                                '<div class="color-palette-title">Neutri</div>' +
                                '<div class="color-grid">' +
                                    '<button class="color-option" style="background: #4a4a4a" data-color="#4a4a4a"></button>' +
                                    '<button class="color-option" style="background: #6b6b6b" data-color="#6b6b6b"></button>' +
                                    '<button class="color-option" style="background: #8c8c8c" data-color="#8c8c8c"></button>' +
                                    '<button class="color-option" style="background: #2d2d2d" data-color="#2d2d2d"></button>' +
                                    '<button class="color-option" style="background: #1a1a1a" data-color="#1a1a1a"></button>' +
                                    '<button class="color-option" style="background: #0d0d0d" data-color="#0d0d0d"></button>' +
                                '</div>' +
                                '<div class="color-palette-title">Broadcast</div>' +
                                '<div class="color-grid">' +
                                    '<button class="color-option" style="background: #ff3333" data-color="#ff3333"></button>' +
                                    '<button class="color-option" style="background: #3366ff" data-color="#3366ff"></button>' +
                                    '<button class="color-option" style="background: #33cc33" data-color="#33cc33"></button>' +
                                    '<button class="color-option" style="background: #ffcc00" data-color="#ffcc00"></button>' +
                                    '<button class="color-option" style="background: #ff66ff" data-color="#ff66ff"></button>' +
                                    '<button class="color-option" style="background: #00cccc" data-color="#00cccc"></button>' +
                                '</div>' +
                                '<div class="color-palette-title">Studio</div>' +
                                '<div class="color-grid">' +
                                    '<button class="color-option" style="background: #8b4513" data-color="#8b4513"></button>' +
                                    '<button class="color-option" style="background: #2e7d32" data-color="#2e7d32"></button>' +
                                    '<button class="color-option" style="background: #1976d2" data-color="#1976d2"></button>' +
                                    '<button class="color-option" style="background: #7b1fa2" data-color="#7b1fa2"></button>' +
                                    '<button class="color-option" style="background: #c2185b" data-color="#c2185b"></button>' +
                                    '<button class="color-option" style="background: #f57c00" data-color="#f57c00"></button>' +
                                '</div>' +

                });

                card.querySelector('.timer-title').addEventListener('input', function(e) {
                    timer.title = e.target.value;
                    self.saveToLocalStorage();
                });

                card.querySelector('.duplicate-btn').addEventListener('click', function() {
                    self.duplicateTimer(timer);
                });

                card.querySelector('.move-up-btn').addEventListener('click', function() {
                    self.moveTimer(timer, 'up');
                });

                card.querySelector('.move-down-btn').addEventListener('click', function() {
                    self.moveTimer(timer, 'down');
                });

                card.querySelector('.delete-btn').addEventListener('click', function() {
                    self.deleteTimer(timer);
                });

                card.querySelector('.countdown-btn').addEventListener('click', function() {
                    timer.setMode('countdown');
                    card.querySelector('.countdown-btn').classList.add('active');
                    card.querySelector('.countup-btn').classList.remove('active');
                    self.saveToLocalStorage();
                });

                card.querySelector('.countup-btn').addEventListener('click', function() {
                    timer.setMode('countup');
                    card.querySelector('.countup-btn').classList.add('active');
                    card.querySelector('.countdown-btn').classList.remove('active');
                    self.saveToLocalStorage();
                });

                card.querySelector('.minutes-input').addEventListener('change', function(e) {
                    timer.setTime(parseInt(e.target.value) || 0, timer.seconds);
                    self.saveToLocalStorage();
                });

                card.querySelector('.seconds-input').addEventListener('change', function(e) {
                    timer.setTime(timer.minutes, parseInt(e.target.value) || 0);
                    self.saveToLocalStorage();
                });

                card.querySelector('.start-btn').addEventListener('click', function() {
                    timer.start();
                });

                card.querySelector('.pause-btn').addEventListener('click', function() {
                    timer.pause();
                });

                card.querySelector('.reset-btn').addEventListener('click', function() {
                    timer.reset();
                });

                var colorPalette = card.querySelector('.color-palette');
                var colorOptions = card.querySelectorAll('.color-option');
                var colorPreview = card.querySelector('.color-preview');

                colorPickerBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    colorPalette.classList.toggle('active');
                });

                // Close palette when clicking outside
                document.addEventListener('click', function(e) {
                    if (!card.contains(e.target)) {
                        colorPalette.classList.remove('active');
                    }
                });

                // Color option selection
                for (var j = 0; j < colorOptions.length; j++) {
                    (function(option) {
                        option.addEventListener('click', function(e) {
                            e.stopPropagation();
                            var color = this.getAttribute('data-color');
                            timer.color = color;
                            colorPreview.style.backgroundColor = color;
                            card.style.borderLeftColor = color;
                            
                            // Update timer name color
                            var timerName = card.querySelector('.timer-name');
                            timerName.style.color = color;
                            
                            // Update selected state
                            for (var k = 0; k < colorOptions.length; k++) {
                                colorOptions[k].classList.remove('selected');
                            }
                            this.classList.add('selected');
                            
                            colorPalette.classList.remove('active');
                            self.saveToLocalStorage();
                        });
                    })(colorOptions[j]);
                }

                // Set initial selected color
                for (var j = 0; j < colorOptions.length; j++) {
                    if (colorOptions[j].getAttribute('data-color') === timer.color) {
                        colorOptions[j].classList.add('selected');
                    }
                }

                // Set initial border color and name color
                card.style.borderLeftColor = timer.color;
                var timerName = card.querySelector('.timer-name');
                timerName.style.color = timer.color;

                // Total overage button
                var totalOverageBtn = card.querySelector('.total-overage-trigger');
                totalOverageBtn.addEventListener('click', function() {
                    self.showTotalOverage();
                });

                container.appendChild(card);
                timer.updateDisplay();
            },

            renderAllTimers: function() {
                var container = document.getElementById('timersContainer');
                container.innerHTML = '';
                for (var i = 0; i < this.timers.length; i++) {
                    this.renderTimer(this.timers[i]);
                }
            }
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                app.init();
            });
        } else {
            app.init();
        }
    </script>
